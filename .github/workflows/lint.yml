name: lint
on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.4
      - run: ruff check app_migrator tests/static_analysis
