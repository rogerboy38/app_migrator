name: CI - Lint, Test, Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'v11.0.0'
  workflow_dispatch:

env:
  FRAPPE_VERSION: "16"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  # ============================================
  # JOB 0: FAST GATE - import + bench-free integrity tests
  # ============================================
  # Why this job exists: commit a3c297b (2026-05-07) added an import for a
  # module that was not in the tree, so every `bench app-migrator` command
  # died with ModuleNotFoundError. The lint job still PASSED, because ruff
  # never imports the package. This job imports it and runs the
  # audit-derived integrity suite in seconds, with no bench and no Frappe.
  fast-gate:
    name: Fast Gate - Import + Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        # The real module-level third-party imports of app_migrator.
        # Pinned to the versions this suite was actually verified against:
        # an unpinned dependency makes a green run unreproducible, and a
        # silent dependency bump turns CI into a coin toss.
        run: pip install "pytest==9.1.1" "click==8.4.2" "pyyaml==6.0.3" "requests==2.34.2" "keyring==25.7.0" "cryptography==47.0.0"

      - name: Import gate - the package must load
        run: python -m pytest tests/static_analysis/test_package_import_gate.py -v

      - name: Bench-free integrity check suite
        run: python -m pytest tests/static_analysis -v

  # ============================================
  # JOB 1: LINT - Code Quality Checks
  # ============================================
  lint:
    name: Lint - Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Ruff
        # Pinned: ruff's rule set changes between releases, so an unpinned
        # install makes a green run unreproducible.
        run: pip install ruff==0.17.4

      - name: Run Ruff Linter
        run: ruff check ./app_migrator

      - name: Run Ruff Formatter Check
        run: ruff format --check ./app_migrator

      - name: Check for sensitive data
        run: |
          echo "Checking for sensitive data patterns..."
          # A match is a failure. The old `|| echo` swallowed grep's exit
          # code, so a real credential *and* a broken grep both looked green.
          if grep -rE "password\s*=\s*['\"][^'\"]{8,}['\"]" ./app_migrator --include="*.py"; then
            echo "::error::Possible hardcoded password in app_migrator"
            exit 1
          else
            status=$?
            if [ "$status" -gt 1 ]; then
              echo "::error::grep failed with exit code $status"
              exit "$status"
            fi
            echo "No hardcoded passwords found"
          fi

  # ============================================
  # JOB 2: UNIT TESTS
  # ============================================
  test-unit:
    name: Test - Unit Tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_frappe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Frappe
        run: |
          pip install frappe==${{ env.FRAPPE_VERSION }}

      - name: Set up test site
        env:
          MYSQL_ROOT_PASSWORD: root_password
          SITE_NAME: test.frappe.test
        run: |
          bench init frappe-bench --frappe-branch version-${{ env.FRAPPE_VERSION }} --python python${{ env.PYTHON_VERSION }}
          cd frappe-bench
          bench get-app frappe --branch version-${{ env.FRAPPE_VERSION }}
          bench new-site ${{ env.SITE_NAME }} --db-name test_frappe --admin-password admin
          bench --site ${{ env.SITE_NAME }} install-app frappe
          # Copy test files
          cp -r ../tests ./apps/app_migrator/
          bench --site ${{ env.SITE_NAME }} install-app app_migrator

      - name: Run App Health Scanner
        run: |
          cd frappe-bench
          bench app-migrator health

      - name: Run Diagnostic Commands
        run: |
          cd frappe-bench
          bench app-migrator diagnose --site test.frappe.test

      - name: Run Python Unit Tests
        run: |
          cd frappe-bench
          # No `|| echo` here: a failing test must fail the job. The old
          # line reported a red test suite as "No pytest tests found".
          python -m pytest tests/ -v

  # ============================================
  # JOB 3: BUILD DOCKER IMAGE
  # ============================================
  build:
    name: Build - Docker Image
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.SHORT_SHA }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          DATETIME=$(date -u +'%Y%m%dT%H%M%SZ')
          echo "DATETIME=$DATETIME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app-migrator
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FRAPPE_VERSION=${{ env.FRAPPE_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            APP_VERSION=${{ steps.vars.outputs.SHORT_SHA }}

      - name: Generate apps.json for Frappe
        run: |
          cat > docker/apps.json << 'EOF'
          {
            "frappe": {
              "url": "https://github.com/frappe/frappe.git",
              "branch": "version-16"
            },
            "app_migrator": {
              "url": "https://github.com/${{ github.repository }}.git",
              "branch": "main"
            }
          }
          EOF

      - name: Upload apps.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-json
          path: docker/apps.json
          retention-days: 7

  # ============================================
  # JOB 4: VERIFY PYPROJECT.TOML VALIDITY
  # ============================================
  verify-config:
    name: Verify - Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install flit
        # The build backend is flit_core (see pyproject.toml). Installing the
        # CLI here proves the declared build requirement is satisfiable.
        run: pip install flit>=3.4

      - name: Validate pyproject.toml
        run: |
          set -euo pipefail
          # The project metadata lives in the repository-root pyproject.toml.
          # The old step did `cd app_migrator` and then `flit validate`: there
          # is no pyproject.toml in that directory, and `validate` was removed
          # from flit in 3.0 (its subcommands are build/publish/install/init),
          # so this step could never have passed. It is replaced by a check
          # that reads the file that actually exists.
          python - <<'PY'
          import pathlib, tomllib

          raw = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))

          build = raw["build-system"]
          if build["build-backend"] != "flit_core.buildapi":
              raise SystemExit(f"unexpected build-backend: {build['build-backend']}")

          project = raw["project"]
          for key in ("name", "description", "requires-python", "readme"):
              if key not in project:
                  raise SystemExit(f"project.{key} is missing")
          if "version" not in project and "version" not in project.get("dynamic", []):
              raise SystemExit("project has neither a static version nor a dynamic one")

          print(f"name          : {project['name']}")
          print(f"version       : {project.get('version', '(dynamic)')}")
          print(f"requires      : {project['requires-python']}")
          print(f"build-backend : {build['build-backend']}")
          PY
          echo "pyproject.toml is valid"

      - name: Check Frappe V16 requirements
        run: |
          echo "Checking Frappe V16 requirements..."
          set -euo pipefail
          # The project metadata lives in the repository-root pyproject.toml.
          # The old path (app_migrator/pyproject.toml) does not exist, so this
          # step was grepping a file that was never there: every check was a
          # no-op and the step could not fail.
          grep -q 'requires-python = ">=3.14"' pyproject.toml
          echo "✓ Python 3.14+ required"
          grep -q 'flit_core' pyproject.toml
          echo "✓ flit_core build backend configured"
          grep -q 'frappe-dependencies' pyproject.toml
          echo "✓ Frappe dependencies declared"

  # ============================================
  # JOB 5: SECURITY SCAN
  # ============================================
  security:
    name: Security - Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run safety check
        # Advisory: the step's outcome is recorded and visible in the run
        # summary instead of being swallowed by `|| echo`, but it does not
        # block the pipeline on its own — the dependency baseline is
        # pre-existing debt that is tracked separately.
        continue-on-error: true
        run: pip install safety && safety check --file requirements.txt

      - name: Check for common security issues
        # Same treatment as the safety check above: visible, not blocking.
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r app_migrator -f json -o security-report.json
          cat security-report.json