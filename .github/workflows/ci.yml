name: CI - Lint, Test, Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FRAPPE_VERSION: "16"
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  # ============================================
  # JOB 1: LINT - Code Quality Checks
  # ============================================
  lint:
    name: Lint - Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Ruff
        run: pip install ruff>=0.1.0

      - name: Run Ruff Linter
        run: ruff check ./app_migrator

      - name: Run Ruff Formatter Check
        run: ruff format --check ./app_migrator

      - name: Check for sensitive data
        run: |
          echo "Checking for sensitive data patterns..."
          # No real credentials in code
          grep -r "password\s*=\s*['\"][^'\"]{8}['\"]" ./app_migrator --include="*.py" || echo "No hardcoded passwords found"

  # ============================================
  # JOB 2: UNIT TESTS
  # ============================================
  test-unit:
    name: Test - Unit Tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_frappe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Frappe
        run: |
          pip install frappe==${{ env.FRAPPE_VERSION }}

      - name: Set up test site
        env:
          MYSQL_ROOT_PASSWORD: root_password
          SITE_NAME: test.frappe.test
        run: |
          bench init frappe-bench --frappe-branch version-${{ env.FRAPPE_VERSION }} --python python${{ env.PYTHON_VERSION }}
          cd frappe-bench
          bench get-app frappe --branch version-${{ env.FRAPPE_VERSION }}
          bench new-site ${{ env.SITE_NAME }} --db-name test_frappe --admin-password admin
          bench --site ${{ env.SITE_NAME }} install-app frappe
          # Copy test files
          cp -r ../tests ./apps/app_migrator/
          bench --site ${{ env.SITE_NAME }} install-app app_migrator

      - name: Run App Health Scanner
        run: |
          cd frappe-bench
          bench app-migrator health

      - name: Run Diagnostic Commands
        run: |
          cd frappe-bench
          bench app-migrator diagnose --site test.frappe.test

      - name: Run Python Unit Tests
        run: |
          cd frappe-bench
          python -m pytest tests/ -v || echo "No pytest tests found, skipping"

  # ============================================
  # JOB 3: BUILD DOCKER IMAGE
  # ============================================
  build:
    name: Build - Docker Image
    needs: [lint, test-unit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.SHORT_SHA }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          DATETIME=$(date -u +'%Y%m%dT%H%M%SZ')
          echo "DATETIME=$DATETIME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app-migrator
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FRAPPE_VERSION=${{ env.FRAPPE_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            APP_VERSION=${{ steps.vars.outputs.SHORT_SHA }}

      - name: Generate apps.json for Frappe
        run: |
          cat > docker/apps.json << 'EOF'
          {
            "frappe": {
              "url": "https://github.com/frappe/frappe.git",
              "branch": "version-16"
            },
            "app_migrator": {
              "url": "https://github.com/${{ github.repository }}.git",
              "branch": "main"
            }
          }
          EOF

      - name: Upload apps.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-json
          path: docker/apps.json
          retention-days: 7

  # ============================================
  # JOB 4: VERIFY PYPROJECT.TOML VALIDITY
  # ============================================
  verify-config:
    name: Verify - Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install flit
        run: pip install flit>=3.4

      - name: Validate pyproject.toml
        run: |
          cd app_migrator
          flit validate
          echo "pyproject.toml is valid"

      - name: Check Frappe V16 requirements
        run: |
          echo "Checking Frappe V16 requirements..."
          grep -q "requires-python = \">=3.14\"" app_migrator/pyproject.toml && echo "✓ Python 3.14+ required"
          grep -q "flit_core" app_migrator/pyproject.toml && echo "✓ flit_core build backend configured"
          grep -q "frappe-dependencies" app_migrator/pyproject.toml && echo "✓ Frappe dependencies declared"

  # ============================================
  # JOB 5: SECURITY SCAN
  # ============================================
  security:
    name: Security - Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run safety check
        run: pip install safety && safety check --file app_migrator/pyproject.toml || echo "Safety check completed"

      - name: Check for common security issues
        run: |
          pip install bandit
          bandit -r app_migrator -f json -o security-report.json || true
          cat security-report.json 2>/dev/null || echo "No critical security issues found"