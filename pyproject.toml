[project]
name = "app_migrator"
authors = [
    { name = "App Migrator", email = "fcrm@amb-wellness.com"}
]
description = "Multi-bench Migration Toolkit for Frappe/ERPNext with CI/CD Integration"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]

dependencies = [
    "keyring>=25.0",
    "requests>=2.33.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff==0.17.4",
]
test = [
    "frappe>=16.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<=17.0.0-dev"

[tool.bench]
title = "App Migrator"
category = "Other"
description = "App migration utility with GitHub Actions CI/CD support"

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = [
    "_archive",
    "tests/legacy_command_tests",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "RUF001",
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
# Every Python file in app_migrator/ (147 of 147) is indented with four
# spaces. The setting used to say "tab", which meant `ruff format --check`
# failed on 107 files that had never been touched by the formatter — the
# config contradicted the codebase, not the other way round.
indent-style = "space"
docstring-code-format = true

[tool.mypy]
strict = false
pretty = true
files = ["app_migrator/**/*.py"]
exclude = ["**/patches/**", "**/legacy/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
