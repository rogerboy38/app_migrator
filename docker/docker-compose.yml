version: "3.8"

services:
  # ============================================
  # Backend Worker (Main Application)
  # ============================================
  backend:
    image: ${REGISTRY:-ghcr.io/${{ github.repository }}/app-migrator}:${IMAGE_TAG:-latest}
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --threads 2 frappe.app:application
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_USER=${DB_USER:-frappe}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - SITES_DIR=/workspace/frappe-bench/sites
      - FRAPPE_SITE=${SITE_NAME}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    depends_on:
      - redis-cache
      - redis-queue
    networks:
      - frappe-network
    volumes:
      - frappe-sites:/workspace/frappe-bench/sites

  # ============================================
  # Queue Workers
  # ============================================
  queue-short:
    image: ${REGISTRY:-ghcr.io/${{ github.repository }}/app-migrator}:${IMAGE_TAG:-latest}
    command: python -m frappe queue short
    environment:
      - DB_HOST=${DB_HOST}
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - SITES_DIR=/workspace/frappe-bench/sites
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - frappe-network

  queue-long:
    image: ${REGISTRY:-ghcr.io/${{ github.repository }}/app-migrator}:${IMAGE_TAG:-latest}
    command: python -m frappe queue long
    environment:
      - DB_HOST=${DB_HOST}
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - SITES_DIR=/workspace/frappe-bench/sites
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - frappe-network

  # ============================================
  # Scheduler
  # ============================================
  scheduler:
    image: ${REGISTRY:-ghcr.io/${{ github.repository }}/app-migrator}:${IMAGE_TAG:-latest}
    command: python -m frappe scheduler
    environment:
      - DB_HOST=${DB_HOST}
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
      - SITES_DIR=/workspace/frappe-bench/sites
    restart: unless-stopped
    networks:
      - frappe-network

  # ============================================
  # Web Frontend (nginx)
  # ============================================
  frontend:
    image: frappe/nginx:v16.front
    environment:
      - BACKEND=backend:8000
      - SOCKETIO=websocket:9000
      - UPSTREAM_TIMEOUT=300
      - RATE_LIMIT=100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - backend
      - websocket
    networks:
      - frappe-network
    ports:
      - "80:80"
      - "443:443"

  # ============================================
  # WebSocket Server
  # ============================================
  websocket:
    image: frappe/websocket:v16
    environment:
      - SOCKETIO_INBOUND_PORT=9000
      -APP_SITES=${SITE_NAME}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - frappe-network

  # ============================================
  # Redis Cache
  # ============================================
  redis-cache:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - frappe-network
    volumes:
      - redis-cache-data:/data

  # ============================================
  # Redis Queue
  # ============================================
  redis-queue:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - frappe-network
    volumes:
      - redis-queue-data:/data

# ============================================
# Networks & Volumes
# ============================================
volumes:
  frappe-sites:
  redis-cache-data:
  redis-queue-data:

networks:
  frappe-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16